mapping_node:
  ros__parameters:
    input_cloud_topic: "/cloud_registered"
    odom_topic: "/Odometry"
    grid_resolution: 0.05
    map_size: 4.0
    num_layers: 60
    layer_height: 0.05
    p_occ_threshold: 0.65
    l_occ: 0.85
    l_free: -0.4
    floor_gate_epsilon: 0.03
    floor_smoothing_nu: 0.7
    plane_dist_threshold: 0.03
    plane_max_count: 3
    plane_normal_angle_deg: 15.0